version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: rider_incentive_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass123}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./rider_incentive_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./populate_global_incentive_schemes.sql:/docker-entrypoint-initdb.d/02-data.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - incentive_network
    restart: unless-stopped

  api:
    build: .
    container_name: rider_incentive_api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      FLASK_ENV: ${FLASK_ENV:-production}
      API_KEY: ${API_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "5000:5000"
    volumes:
      - ./logs:/app/logs
    networks:
      - incentive_network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  incentive_network:
    driver: bridge
